name: Deep verification lane

# Layer 2 deep verification: every check intentionally off the fast PR path
# (ci.yml) lives here, preserved at full depth. Triggered on merge to main,
# nightly, and manual dispatch — never on PRs.
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  dialyzer:
    name: Dialyzer (type analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `mix dialyzer` triggers `mix compile`; compilation does not need a DB,
    # but the postgres service is harmless insurance and mirrors test-fast.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache Mix dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: ${{ runner.os }}-mix-deep-dialyzer-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      # Dialyxir 1.4 stores the project PLT under `_build/<env>/`; `priv/plts`
      # is the legacy-agnostic fallback. Key pins OTP/Elixir because PLT
      # filenames embed erts/elixir versions (see docs/production-readiness.md).
      - name: Cache Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: |
            _build
            priv/plts
          key: ${{ runner.os }}-plt-27-1.18-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-27-1.18-

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Run Dialyzer
        run: mix dialyzer

  coverage:
    name: Coverage (coveralls, floor 86.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # `mix coveralls` runs the full suite with the ExCoveralls floor from
    # coveralls.json (86.1); the test alias auto-creates/migrates the DB.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache Mix dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: ${{ runner.os }}-mix-deep-cov-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Mix dependencies
        run: mix deps.get

      # `--max-cases 8` forwards to `mix test` (ExCoveralls passes unknown args
      # through), tuning parallelism for the 2-core GitHub runner.
      - name: Run test suite with coverage
        run: mix coveralls --max-cases 8

  full-suite:
    name: Full suite (mix ci, incl. assets)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # `mix ci` = compile + deps.unlock + format + credo + sobelow + hex.audit
    # + assets.setup + assets.build + test.full. Asset-build verification moved
    # here from the fast path and is preserved at full depth.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache Mix dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: ${{ runner.os }}-mix-deep-full-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Run full CI suite
        run: mix ci

  provenance:
    name: Provenance audit (make audit-provenance)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `make audit-provenance` runs the full-corpus provenance audit. Its
    # `ensure_postgres.sh` helper invokes `nix run nixpkgs#devenv`, so Nix is
    # installed here; the postgres:16 service + env provide the DB the app
    # connects to (DATABASE_PORT=5432).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache Mix dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: ${{ runner.os }}-mix-deep-prov-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/determinate-nix-action@main
        with:
          cache: true

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Run provenance audit
        run: make audit-provenance

  browser:
    name: Browser QA (STRICT_TIMING)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # `STRICT_TIMING=1 make test-browser` runs the full browser evidence sweep.
    # browser_qa.sh requires a Chromium binary (it does not self-install) and
    # its `ensure_postgres.sh` helper invokes `nix run nixpkgs#devenv`, so
    # Chrome and Nix are installed here; the postgres:16 service + env provide
    # the DB the app connects to.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache Mix dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: ${{ runner.os }}-mix-deep-browser-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/determinate-nix-action@main
        with:
          cache: true

      - name: Install Chromium
        uses: browser-actions/setup-chrome@v1

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Run browser QA with strict timing
        run: STRICT_TIMING=1 make test-browser

  ingestion-drills:
    name: Ingestion drills (production + adversarial)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Both drill scripts start Postgres via `ensure_postgres.sh` (which invokes
    # `nix run nixpkgs#devenv`), and the adversarial script runs the sidecar
    # probe via `uv run`, so Nix + Python/uv are installed here; the postgres:16
    # service + env provide the DB the app connects to.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache Mix dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: ${{ runner.os }}-mix-deep-drills-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/determinate-nix-action@main
        with:
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: sidecar/uv.lock

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Run production ingestion drill
        run: bash scripts/qa/ingestion/production_ingestion_drill.sh

      - name: Run production ingestion adversarial drill
        run: bash scripts/qa/ingestion/production_ingestion_adversarial.sh

  sidecar-pytest:
    name: Sidecar pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Isolated sidecar tests: no Postgres needed. Mirrors the retired
    # standalone sidecar job from ci.yml.
    defaults:
      run:
        working-directory: sidecar

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: sidecar/uv.lock

      - name: Run sidecar dev test gate
        run: uv run --extra dev pytest -q

      - name: Run sidecar ruff lint
        run: uv run ruff check .

      - name: Run sidecar ruff format check
        run: uv run ruff format --check .

      - name: Run sidecar pyright type check
        run: uv run pyright

      - name: Run sidecar supply-chain audit
        run: uv audit

  scripts-tests:
    name: Scripts tests (tests/scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Isolated Python tests for the catalog generator scripts under
    # tests/scripts, driven by the root pyproject.toml (dev group = pytest).
    # No Postgres needed; the generator scripts are stdlib-only.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Run scripts test gate
        run: uv run --project . pytest tests/scripts -q

  devenv-full:
    name: Nix/devenv full readiness graph (devenv test)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The full devenv readiness graph (`devenv -- test`). devenv manages its
    # own Postgres, so no postgres service here. Extended budget for the
    # acknowledged cold-Nix evaluation.
    env:
      MIX_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/determinate-nix-action@main
        with:
          cache: true

      - name: Run full devenv readiness graph
        run: nix run nixpkgs#devenv -- test

  release-build:
    name: Release image builds (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Builds both production images (root Phoenix release + private sidecar)
    # to gate that the Dockerfiles stay buildable. Heavy, so it lives in the
    # deep lane, not the fast PR path (ci.yml). Images are tagged ci-test and
    # never pushed; no registry credentials are used.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build root image
        run: docker build -t hiraeth:ci-test .

      - name: Build sidecar image
        run: docker build -t hiraeth-sidecar:ci-test sidecar/
