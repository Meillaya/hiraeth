name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    name: Static gates (format/credo/sobelow/hex.audit)
    runs-on: ubuntu-latest

    # Pure static gates: no Postgres needed. Fast parallel feedback lane;
    # wall-time design target < 5 min (setup-beam + deps cache hit + 4 static
    # gates, all of which exit 0 on this repo).
    env:
      MIX_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache Mix dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: ${{ runner.os }}-mix-static-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Credo (strict)
        run: mix credo --strict

      - name: Run Sobelow (exit Low)
        run: mix sobelow --config .sobelow-conf --exit Low

      # Run in a fresh Mix VM: Mix purges archive tasks (hex.audit lives in
      # the hex archive) once `compile` runs in the same VM, so a bare
      # "mix hex.audit" step fails with "task could not be found" in-chain
      # (same rationale as the `cmd mix hex.audit` step in the ci alias).
      - name: Audit Hex dependencies
        run: mix cmd mix hex.audit

  test-fast:
    name: Fast test suite (test.fast)
    runs-on: ubuntu-latest

    # `mix test.fast` (via the test alias) auto-creates and migrates
    # hiraeth_test on this container; env mirrors the retired legacy lane.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache Mix dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: ${{ runner.os }}-mix-tf-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Run fast test suite
        run: mix test.fast

  devenv-smoke:
    name: Nix/devenv smoke (postgres up + mix gate)
    runs-on: ubuntu-latest

    # Acknowledged cold-Nix exception: first `nix run nixpkgs#devenv`
    # evaluates the whole dev environment (BEAM/Postgres/Node toolchain), so
    # this job gets an extended budget. Deliberately lean: it only proves
    # devenv can start Postgres and run the fast blocking gate; the full
    # readiness graph lives in the deep lane, not here.
    timeout-minutes: 20

    env:
      MIX_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/determinate-nix-action@main
        with:
          cache: true

      - name: Start devenv Postgres and wait for readiness
        run: |
          set -euo pipefail
          nix run nixpkgs#devenv -- up -d hiraeth-postgres
          nix run nixpkgs#devenv -- shell -- bash -lc 'timeout 120 bash -c "until pg_isready -h 127.0.0.1 -p 54320 -U postgres; do sleep 2; done"'

      - name: Run fast blocking gate in devenv shell
        run: nix run nixpkgs#devenv -- shell -- bash -lc 'mix gate'
