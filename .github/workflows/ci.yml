name: CI

# Triggers: every PR, plus pushes to main. The main-push static gates
# intentionally overlap the deep lane's 3-partition test matrix: PR-time
# static checks are the fast protection, while the deep lane re-runs
# everything at full depth on merge to main, nightly, and manual dispatch.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    name: Static gates (format/credo/sobelow/hex.audit)
    runs-on: ubuntu-latest

    # Pure static gates: no Postgres needed. Fast parallel feedback lane;
    # wall-time design target < 5 min (setup-beam + deps cache hit + 4 static
    # gates, all of which exit 0 on this repo).
    env:
      MIX_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      # Hex registry + Mix archives caches: avoid re-downloading the hex
      # registry/tarballs and archives on lockfile changes or cold restores.
      # Separate blocks so a hex cache miss never invalidates the deps cache.
      - name: Cache Hex registry (~/.hex)
        uses: actions/cache@v4
        with:
          path: ~/.hex
          key: ${{ runner.os }}-hex-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-hex-

      - name: Cache Mix archives (~/.mix)
        uses: actions/cache@v4
        with:
          path: ~/.mix
          key: ${{ runner.os }}-mix-otp27-elixir118-
          restore-keys: |
            ${{ runner.os }}-mix-

      # Intility deps/_build cache recipe: separate caches for deps and
      # _build/test (paths never overlap); the deps key pins OTP/Elixir +
      # mix.lock; the _build key also hashes sources plus an explicit root
      # mix.exs (`**` globs do not match root files). On a partial deps hit,
      # stale deps are removed before deps.get; restored files are touched to
      # normalize mtimes (elixir-lang/elixir#12056).
      - name: Cache Mix dependencies (deps)
        id: mix-deps-cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-deps-27-1.18-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-27-1.18-

      - name: Cache Mix build (_build/test)
        id: mix-build-cache
        uses: actions/cache@v4
        with:
          path: _build/test
          key: ${{ runner.os }}-build-test-27-1.18-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('**/*.ex', '**/*.exs') }}-${{ hashFiles('mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-build-test-27-1.18-${{ hashFiles('**/mix.lock') }}-

      - name: Remove stale deps on partial cache hit
        if: steps.mix-deps-cache.outputs.cache-hit != 'true'
        run: rm -rf deps

      - name: Touch cached deps and build files
        if: steps.mix-deps-cache.outputs.cache-hit == 'true' || steps.mix-build-cache.outputs.cache-hit == 'true'
        run: find deps _build/test -type f -exec touch {} + 2>/dev/null || true

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Credo (strict)
        run: mix credo --strict

      - name: Run Sobelow (exit Low)
        run: mix sobelow --config .sobelow-conf --exit Low

      # Run in a fresh Mix VM: Mix purges archive tasks (hex.audit lives in
      # the hex archive) once `compile` runs in the same VM, so a bare
      # "mix hex.audit" step fails with "task could not be found" in-chain
      # (same rationale as the `cmd mix hex.audit` step in the ci alias).
      - name: Audit Hex dependencies
        run: mix cmd mix hex.audit

  test-fast:
    name: Fast test suite (test.fast)
    runs-on: ubuntu-latest

    # `mix test.fast` (via the test alias) auto-creates and migrates
    # hiraeth_test on this container; env mirrors the retired legacy lane.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MIX_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache Hex registry (~/.hex)
        uses: actions/cache@v4
        with:
          path: ~/.hex
          key: ${{ runner.os }}-hex-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-hex-

      - name: Cache Mix archives (~/.mix)
        uses: actions/cache@v4
        with:
          path: ~/.mix
          key: ${{ runner.os }}-mix-otp27-elixir118-
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Cache Mix dependencies (deps)
        id: mix-deps-cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-deps-27-1.18-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-27-1.18-

      - name: Cache Mix build (_build/test)
        id: mix-build-cache
        uses: actions/cache@v4
        with:
          path: _build/test
          key: ${{ runner.os }}-build-test-27-1.18-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('**/*.ex', '**/*.exs') }}-${{ hashFiles('mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-build-test-27-1.18-${{ hashFiles('**/mix.lock') }}-

      - name: Remove stale deps on partial cache hit
        if: steps.mix-deps-cache.outputs.cache-hit != 'true'
        run: rm -rf deps

      - name: Touch cached deps and build files
        if: steps.mix-deps-cache.outputs.cache-hit == 'true' || steps.mix-build-cache.outputs.cache-hit == 'true'
        run: find deps _build/test -type f -exec touch {} + 2>/dev/null || true

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Run fast test suite
        run: mix test.fast
