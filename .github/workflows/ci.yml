name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  devenv:
    name: Nix/devenv migrated local gates
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Bootstrap Mix dependencies in devenv shell
        run: |
          set -euo pipefail
          nix run nixpkgs#devenv -- shell -- bash -lc 'mix local.hex --force && mix local.rebar --force && mix deps.get'

      - name: Run devenv process/readiness test graph
        run: nix run nixpkgs#devenv -- test

      - name: Run migrated CI gates in devenv shell
        run: |
          set -euo pipefail
          cleanup() {
            nix run nixpkgs#devenv -- processes down || true
          }
          trap cleanup EXIT

          nix run nixpkgs#devenv -- up -d hiraeth-postgres
          nix run nixpkgs#devenv -- shell -- bash -lc 'timeout 120 bash -c "until pg_isready -h 127.0.0.1 -p 54320 -U postgres; do sleep 2; done"'
          nix run nixpkgs#devenv -- shell -- mix ci
          nix run nixpkgs#devenv -- shell -- bash -lc 'cd sidecar && uv run --extra dev pytest -q'

  legacy-compose-postgres:
    name: Temporary legacy-compose-postgres comparison gate
    runs-on: ubuntu-latest

    # Temporary fallback/comparison lane while CI moves to the devenv job above.
    # Keep service-container failures visible by isolating them from the devenv lane.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache Mix dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Install asset toolchain
        run: mix assets.setup

      - name: Check assets build
        run: mix assets.build

      - name: Run Phoenix legacy comparison gate
        run: mix ci

  sidecar:
    name: Sidecar dev tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sidecar

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: sidecar/uv.lock

      - name: Run sidecar dev test gate
        run: uv run --extra dev pytest -q
